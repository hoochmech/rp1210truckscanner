name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.2.0 (the tag is created on the selected branch)
        required: true

env:
  TAG: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Rp1210Scanner.Tests -c Release
      - name: Publish
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart('v')
          dotnet publish src/Rp1210Scanner.App -c Release -o publish -p:Version=$version
          Compress-Archive -Path publish/TruckScanner.exe -DestinationPath "TruckScanner-$env:TAG-win-x86.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:TAG" "TruckScanner-$env:TAG-win-x86.zip" publish/TruckScanner.exe --target "${{ github.sha }}" --title "TruckScanner $env:TAG" --generate-notes
