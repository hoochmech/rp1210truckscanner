name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Rp1210Scanner.Tests -c Release
      - run: dotnet publish src/Rp1210Scanner.App -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: TruckScanner
          path: publish/TruckScanner.exe
